<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phonetic Goblin Generator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#129503;</text></svg>">
</head>
<body>
  <main>
    <header>
      <h1>Phonetic Goblin Generator</h1>
    </header>

    <div class="controls">
      <button id="reroll">Reroll</button>
      <span id="batch-label"></span>
    </div>

    <ul id="batch" class="batch"></ul>

    <section class="keepers-section">
      <div class="keepers-head">
        <h2>Keepers</h2>
        <button id="copy" class="small">Copy list</button>
      </div>
      <ul id="keepers" class="keepers"></ul>
    </section>
  </main>

  <footer>
    <a href="https://github.com/csmather/phonetic-goblins">source</a>
  </footer>

  <script src="pools.js"></script>
  <script src="goblins.js"></script>
  <script src="app.js"></script>
</body>
</html>
